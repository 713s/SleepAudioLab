name: v0.3 labeled snore classifier baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sleep_audio/classical_classifier.py"
      - "scripts/import_khan_dataset.py"
      - "tests/test_classical_classifier.py"
      - ".github/workflows/v03-classical-baseline.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' kagglehub
      - name: Verify numerical features and classifier on synthetic data
        run: pytest -q
      - name: Download public Kaggle training dataset into ephemeral runner
        run: |
          python - <<'PY'
          import kagglehub
          path = kagglehub.dataset_download("tareqkhanemu/snoring")
          print("Downloaded dataset into:", path)
          from pathlib import Path
          import os
          root = Path(path)
          candidates = [
              entry for entry in [root, *root.rglob("*")]
              if entry.is_dir() and (entry / "0").is_dir() and (entry / "1").is_dir()
          ]
          if not candidates:
              raise RuntimeError("Kaggle dataset does not contain expected 0/ and 1/ folders")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"KHAN_AUDIO_ROOT={candidates[0]}\n")
          PY
      - name: Build label manifest and run exploratory clip-split benchmark
        run: |
          python scripts/import_khan_dataset.py "$KHAN_AUDIO_ROOT" --out data/processed/khan_manifest.csv
          python -m sleep_audio.classical_classifier data/processed/khan_manifest.csv \
            --out reports/v03 --allow-clip-split
      - name: Upload metrics without redistributing third-party audio
        uses: actions/upload-artifact@v4
        with:
          name: v03-khan-exploratory-metrics
          path: reports/v03/evaluation.json
          if-no-files-found: error
          retention-days: 30
