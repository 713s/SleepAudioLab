name: ICSD adapter synthetic tests

on:
  push:
    paths:
      - "src/sleep_audio/icsd_adapter.py"
      - "tests/test_icsd_adapter.py"
      - ".github/workflows/test-icsd-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Assert official test-split and label conversion guards
        run: pytest -q tests/test_icsd_adapter.py
