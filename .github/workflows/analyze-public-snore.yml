name: Analyze public snore sample

on:
  push:
    paths:
      - "src/sleep_audio/snore_analysis.py"
      - "tests/test_snore_analysis.py"
      - ".github/workflows/analyze-public-snore.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Generate real-audio report
        env:
          MPLBACKEND: Agg
        run: |
          python -m sleep_audio.snore_analysis \
            data/samples/snoring_cc0.ogg \
            --out examples/public_snore_analysis
      - name: Commit reproducible public-sample analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/public_snore_analysis/
          if ! git diff --cached --quiet; then
            git commit -m "Publish experimental analysis of CC0 snore sample"
            git push
          fi
